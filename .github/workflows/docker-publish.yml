name: Publish Docker Image

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      signer_ref:
        description: Private signer repository ref to build into the image
        required: false
        default: main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wangchudi/cs-demo-downloader

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate private signer secrets
        run: |
          test -n "${{ secrets.PWA_SIGNER_REPOSITORY }}"
          test -n "${{ secrets.PWA_SIGNER_REPOSITORY_TOKEN }}"

      - name: Check out private signer repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PWA_SIGNER_REPOSITORY }}
          ref: ${{ github.event.inputs.signer_ref || github.ref_name }}
          token: ${{ secrets.PWA_SIGNER_REPOSITORY_TOKEN }}
          path: signer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux signer wheels
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_TEST_COMMAND: "python -c \"import cs_demo_pwa_signer; assert hasattr(cs_demo_pwa_signer, 'sign_demo_request'); assert hasattr(cs_demo_pwa_signer, 'build_x_pwa_signature')\""
          CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
          CIBW_ENVIRONMENT_LINUX: "PATH=$PATH:$HOME/.cargo/bin"
        run: |
          python -m pip install --upgrade pip cibuildwheel
          python -m cibuildwheel signer --output-dir wheelhouse
          python scripts/verify_private_signer_wheel.py wheelhouse/*.whl
          python scripts/select_private_signer_wheel.py wheelhouse

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            PYTHON_VERSION=3.12
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Wine Docker metadata
        id: meta-wine
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-wine,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' }}
            type=sha,format=short

      - name: Build and push Wine Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wine
          platforms: linux/amd64
          build-args: |
            PYTHON_VERSION=3.12
          push: true
          tags: ${{ steps.meta-wine.outputs.tags }}
          labels: ${{ steps.meta-wine.outputs.labels }}
          cache-from: type=gha,scope=wine
          cache-to: type=gha,mode=max,scope=wine
