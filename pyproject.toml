[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-demo-downloader"
version = "0.1.0"
description = "Download Counter-Strike demos from 5EPlay, Perfect World Arena, and Steam share-code sources."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "WangChuDi" }
]
keywords = ["cs2", "csgo", "counter-strike", "demo", "downloader", "5e", "pwa", "steam"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities"
]
dependencies = [
  "requests>=2.28.0"
]

[project.optional-dependencies]
gui = [
  "PyQt5>=5.15.0"
]
steam-boiler = [
  "csgo",
  "protobuf<5"
]
steam-login = [
  "steam",
  "csgo",
  "gevent",
  "protobuf<5"
]
steam = [
  "protobuf<5",
  "steam",
  "csgo",
  "gevent"
]
dev = [
  "build",
  "twine"
]

[project.scripts]
cs-demo-downloader = "cs_demo_downloader.cli:main"
cs-demo-downloader-gui = "cs_demo_downloader.gui_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.basedpyright]
include = ["src", "tests", "cli.py", "main.py"]
extraPaths = ["src"]

[tool.pyright]
include = ["src", "tests", "cli.py", "main.py"]
extraPaths = ["src"]
